[bar.default]
capsule = true
center = [ "notifications", "clock", "weather" ]
concave_edge_corners = false
end = [ "media", "tray", "group:g1" ]
margin_edge = 0
margin_ends = 0
radius = 0
start = [ "launcher", "workspaces", "active_window", "nix-monitor" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth", "volume", "brightness", "session" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[config]

[control_center]
width = 800

[dock]
active_monitor_only = true
auto_hide = true
enabled = true
icon_size = 32
launcher_position = "start"
pinned = [ "firefox", "com.mitchellh.ghostty", "code" ]
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 970.0
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[osd]
position = "bottom_center"

    [osd.kinds]
    media = false

[plugin_settings."avivbintangaringga/nix-monitor"]
clean_command = "nix-collect-garbage -d"
close_on_enter = false
optimize_command = "nix-store --optimise -vv"
update_command = "nh os switch -u > /tmp/nixos-update.log"

[plugin_settings."kenn/keybind-cheatsheet"]
show_actions = true

[plugins]
enabled = [ "noctalia/bitwarden", "kenn/keybind-cheatsheet", "icefish/phone-connect", "avivbintangaringga/nix-monitor" ]

[shell]
avatar_path = "/var/lib/AccountsService/icons/jaydenv"
font_family = "JetBrainsMono Nerd Font"
launch_apps_custom_command = "uwsm app -- $CMD"
polkit_agent = true
settings_show_advanced = false
time_format = "{:%I:%M %p}"

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    compact = true

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    open_near_click_session = true
    session_position = "center"

[templates]

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Macchiato Blue"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/jaydenv/Pictures/Wallpapers/catppuccin-wallpapers/landscapes/yosemite.png"

[wallpaper.last]
path = "/home/jaydenv/Pictures/Wallpapers/catppuccin-wallpapers/landscapes/yosemite.png"

[wallpaper.monitors.DP-1]
path = "/home/jaydenv/Pictures/Wallpapers/catppuccin-wallpapers/landscapes/yosemite.png"

[wallpaper.monitors.DP-2]
path = "/home/jaydenv/Pictures/Wallpapers/catppuccin-wallpapers/landscapes/yosemite.png"

[widget.active_window]
interactive = false

[widget.brightness]
show_label = false

[widget.clock]
anchor = true
format = "{:%I:%M %p}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false
show_vpn_label = true

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.taskbar]
group_single_icon_per_app = true
hide_empty_workspaces = true
show_all_outputs = true

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.weather]
show_condition = false

[widget.workspaces]
label_source = "name"
